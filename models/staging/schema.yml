version: 2

models:
  - name: stg_customers
    config:
      tags: ["staging", "PII"]
    columns:
      - name: customer_id

  - name: stg_orders
    config:
      tags: ["staging", "finance"]
    columns:
      - name: order_id
      - name: status

    description: A standardized staging model that transforms raw order data from
      the training dataset into a clean, consistent format for financial analysis.
      This model renames key fields (converting 'id' to 'order_id' and 'user_id' to
      'customer_id') while preserving essential order information such as order date
      and status. It serves as a foundation for downstream financial reporting and
      order analysis by providing normalized order data with consistent field naming
      conventions.
  - name: stg_payments
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
      - name: payment_method

      - name: order_id
        data_tests:
          - not_null:
              description: The order_id column in the stg_payments table should not
                contain null values
              config:
                tags:
                  - ui-tag
                  - ui-tag-2
              meta:
                owner:
                  - ui-owner
  - name: stg_signups
    config:
      tags: ["staging", "PII"]
    columns:
      - name: signup_id
      - name: customer_email
