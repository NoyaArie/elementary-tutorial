version: 2

models:
  - name: stg_customers
    config:
      tags: ["staging", "PII"]
    columns:
      - name: customer_id

  - name: stg_orders
    config:
      tags: ["staging", "finance"]
    columns:
      - name: order_id
      - name: status

  - name: stg_payments
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
      - name: payment_method

      - name: order_id
        data_tests:
          - not_null:
              description: The order_id column in the stg_payments table should not
                contain null values
              config:
                tags:
                  - ui-tag
                  - ui-tag-2
              meta:
                owner:
                  - ui-owner
  - name: stg_signups
    config:
      tags: ["staging", "PII"]
    columns:
      - name: signup_id
      - name: customer_email
    description: A staging model that standardizes and renames user signup data from
      the source system. This model contains customer signup information including
      customer IDs, email addresses, hashed passwords, and signup dates. It serves
      as a cleaned foundation for downstream customer acquisition and authentication
      analysis, transforming raw signup data into consistently named fields with appropriate
      data types. Contains PII data that should be handled according to data governance
      policies.
