version: 2

models:
  - name: stg_customers
    config:
      tags: ["staging", "PII"]
    columns:
      - name: customer_id

  - name: stg_orders
    config:
      tags: ["staging", "finance"]
    columns:
      - name: order_id
      - name: status

  - name: stg_payments
    config:
      tags: ["staging", "finance"]
    columns:
      - name: payment_id
      - name: payment_method

      - name: order_id
        data_tests:
          - not_null:
              description: The order_id column in the stg_payments table should not
                contain null values
              config:
                tags:
                  - ui-tag
                  - ui-tag-2
              meta:
                owner:
                  - ui-owner
    description: "# Model Description: stg_payments\n\nA staging model that standardizes
      payment data from the source system. This model represents individual payment
      transactions with their associated order information and payment methods. It
      performs a key transformation by converting payment amounts from cents to dollars,
      making the data more intuitive for financial analysis and reporting. This model
      serves as a foundation for downstream financial models and analytics."
  - name: stg_signups
    config:
      tags: ["staging", "PII"]
    columns:
      - name: signup_id
      - name: customer_email
