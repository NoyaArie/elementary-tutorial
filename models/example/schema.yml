version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    columns:
      - name: id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
    description: "# Model Description: my_second_dbt_model\n\nThis model filters data
      from my_first_dbt_model to return only records where the ID equals 1. It serves
      as a simple example of how to reference another model and apply filtering logic
      in dbt. This model demonstrates the use of the ref function and basic WHERE
      clause filtering, making it useful for new dbt users to understand model dependencies
      and data transformation fundamentals."
